[workspace]
resolver = "3"
members = ["crates/parallax-core", "crates/parallax-cli", "app/src-tauri"]
default-members = ["crates/parallax-core", "crates/parallax-cli"]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/erpel-dev/ParallaxCompare"
rust-version = "1.88"

[workspace.dependencies]
parallax-core = { path = "crates/parallax-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Diffing and hashing are hot paths; keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2
# Every test and example links all dependencies statically; with their debug
# info, the examples alone outgrew the CI runner's disk.
debug = false
