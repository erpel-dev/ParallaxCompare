name: Release

# Builds installers for Windows (MSI, NSIS) and Linux (deb, rpm, AppImage)
# and attaches them to a draft GitHub release for the pushed tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Build CLI
        run: cargo build --release -p parallax-cli

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ParallaxCompare ${{ github.ref_name }}
          releaseDraft: true

      - name: Attach CLI
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exe=target/release/parallax
          [ "$RUNNER_OS" = "Windows" ] && exe=target/release/parallax.exe
          name="parallax-${{ github.ref_name }}-${RUNNER_OS,,}$([ "$RUNNER_OS" = "Windows" ] && echo .exe)"
          cp "$exe" "$name"
          gh release upload "${{ github.ref_name }}" "$name" --clobber
