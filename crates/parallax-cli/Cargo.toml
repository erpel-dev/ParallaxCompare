[package]
name = "parallax-cli"
description = "Command-line interface of ParallaxCompare"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "parallax"
path = "src/main.rs"

[dependencies]
parallax-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

# musl's allocator serialises the parallel compare; the static Linux build uses mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
